<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --accent: #3b6ef6;
      --ink: #f1f1f3;
      --muted: #87878f;
      --line: #2c2c31;
      --bg: #0c0c0f;
      --card: #18181c;
      --surface-2: #202024;
      --green: #22c55e;
    }
    * { box-sizing: border-box; }
    html { background: transparent; }
    body {
      width: 460px;
      margin: 0;
      border-radius: 16px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
    }
    header {
      display: flex; align-items: center; gap: 9px;
      padding: 15px 17px;
    }
    .logo {
      width: 30px; height: 30px; border-radius: 11px;
      background: linear-gradient(135deg, #4a7bff, #2f5fe0);
      display: flex; align-items: center; justify-content: center;
    }
    .title { font-weight: 700; font-size: 14px; }
    .title span { color: #5b8bff; }
    .tabs {
      display: flex; gap: 6px; margin: 2px 14px 0;
      background: var(--surface-2); padding: 5px; border-radius: 14px;
    }
    .tab {
      flex: 1; padding: 9px 8px; border: 0; cursor: pointer;
      background: transparent; color: var(--muted);
      font: inherit; font-size: 12px; font-weight: 700;
      border-radius: 10px; transition: background .15s, color .15s;
    }
    .tab.active { background: var(--card); color: var(--ink); }
    main { padding: 14px 17px 20px; }
    .pane { display: none; }
    .pane.active { display: block; }
    input {
      width: 100%; padding: 11px 14px; margin-bottom: 10px;
      border: 1px solid var(--line); border-radius: 13px; outline: none;
      background: var(--card); color: var(--ink); font: inherit;
    }
    input:focus { border-color: var(--accent); }
    .go {
      font: inherit; font-weight: 700;
      width: 100%;
      padding: 12px 16px; border: 0; border-radius: 15px; cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    .go:hover { background: #345fdb; }
    .go:disabled { opacity: .55; cursor: not-allowed; }
    .muted { color: var(--muted); font-size: 12px; }
    .target {
      display: flex; align-items: center; gap: 8px; margin: 13px 0;
      background: var(--surface-2);
      border: 1px solid var(--line); border-radius: 15px; padding: 11px 13px;
    }
    .target b { font-size: 13px; }
    .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 13px 0; }
    .mtile {
      background: var(--surface-2); border: 1px solid var(--line);
      border-radius: 18px; padding: 14px 15px;
    }
    .mtile .mv { font-size: 23px; font-weight: 800; line-height: 1; }
    .mtile .ml { font-size: 11px; color: var(--muted); margin-top: 6px; font-weight: 600; }
    .tw {
      border: 1px solid var(--line); border-radius: 16px;
      overflow: hidden; margin-top: 12px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th {
      text-align: left; padding: 9px 11px; color: var(--muted);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid var(--line); background: var(--surface-2);
    }
    td { padding: 9px 11px; border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: 0; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .rank-top { color: var(--green); font-weight: 700; }
    .tgt { color: #5b8bff; font-weight: 700; }
    .result { max-height: 360px; overflow-y: auto; margin-top: 4px; }
    .hrow {
      display: flex; align-items: center; gap: 9px;
      background: var(--surface-2); border: 1px solid var(--line);
      border-radius: 13px; padding: 9px 12px; margin-bottom: 7px;
    }
    .hrow .hmain { flex: 1; min-width: 0; }
    .hrow .ht { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hrow .hs { font-size: 11px; color: var(--muted); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hrow .hr { font-size: 15px; font-weight: 800; }
    .secbtn {
      padding: 8px 12px; border-radius: 11px; background: var(--surface-2);
      color: var(--ink); border: 1px solid var(--line);
      font: inherit; font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .secbtn:hover { background: #2a2a30; }
    .spinner {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid var(--line); border-top-color: #5b8bff;
      display: inline-block; vertical-align: -3px; margin-right: 7px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9.5" stroke="#fff" stroke-width="1.6" opacity=".5"/>
        <circle cx="12" cy="12" r="5.5" stroke="#fff" stroke-width="1.6" opacity=".8"/>
        <circle cx="12" cy="12" r="2" fill="#fff"/>
        <path d="M12 12 L20 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="title">Rank<span>Radar</span></div>
  </header>
  <div class="tabs">
    <button class="tab active" data-tab="kw">Ключи</button>
    <button class="tab" data-tab="metric">Метрики</button>
    <button class="tab" data-tab="hist">История</button>
  </div>
  <main>
    <div class="pane active" id="pane-kw">
      <div id="target" class="target" style="display:none"></div>
      <div style="display:flex;gap:8px">
        <button id="go" class="go" style="flex:1">Подобрать ключи</button>
        <button id="recalcBtn" class="secbtn" title="Подобрать заново, игнорируя кэш">↻</button>
      </div>
      <div id="result" class="result"></div>
    </div>
    <div class="pane" id="pane-metric">
      <input id="kwInput" placeholder="ключевое слово" />
      <button id="checkBtn" class="go">Проверить позицию</button>
      <div id="metricResult" class="result"></div>
    </div>
    <div class="pane" id="pane-hist">
      <button id="histRefresh" class="secbtn" style="width:100%">↻ Обновить историю</button>
      <div id="histResult" class="result"></div>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
