<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --brand: #5b5ef4;
      --ink: #e9eaf2;
      --muted: #9498a8;
      --line: #2b2d3a;
      --bg: #0e0f15;
      --card: #181a23;
      --surface-2: #1f2230;
      --green: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      width: 460px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
    }
    header {
      display: flex; align-items: center; gap: 9px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .logo {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, #5b5ef4, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
    }
    .title { font-weight: 700; font-size: 14px; }
    .title span { color: var(--brand); }
    main { padding: 14px 16px 18px; }
    button {
      font: inherit; font-weight: 600;
      width: 100%;
      padding: 10px 14px; border: 0; border-radius: 9px; cursor: pointer;
      background: linear-gradient(135deg, #5b5ef4, #8b5cf6);
      color: #fff;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .muted { color: var(--muted); font-size: 12px; }
    .target {
      display: flex; align-items: center; gap: 7px;
      background: var(--surface-2);
      border: 1px solid var(--line); border-radius: 9px;
      padding: 9px 11px; margin-bottom: 11px;
    }
    .target b { font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
    th {
      text-align: left; padding: 7px 8px; color: var(--muted);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
      border-bottom: 1px solid var(--line); background: var(--surface-2);
    }
    td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: 0; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .rank-top { color: var(--green); font-weight: 700; }
    .rank-none { color: var(--muted); opacity: .6; }
    .result { max-height: 360px; overflow-y: auto; margin-top: 4px; }
    .spinner {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid var(--line); border-top-color: var(--brand);
      display: inline-block; vertical-align: -3px; margin-right: 7px;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9.5" stroke="#fff" stroke-width="1.6" opacity=".5"/>
        <circle cx="12" cy="12" r="5.5" stroke="#fff" stroke-width="1.6" opacity=".8"/>
        <circle cx="12" cy="12" r="2" fill="#fff"/>
        <path d="M12 12 L20 6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="title">Rank<span>Radar</span></div>
  </header>
  <main>
    <div id="target" class="target" style="display:none"></div>
    <button id="go">Подобрать ключи</button>
    <div id="result" class="result"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
